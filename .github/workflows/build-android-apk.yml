name: Build Santtos Player APK

on:
  push:
    branches: [ main ]
    paths:
      - 'android-player/**'
      - '.github/workflows/build-android-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    name: Build Android TV APK
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android SDK
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build debug APK
        working-directory: android-player
        run: gradle --no-daemon :app:assembleDebug

      - name: Verify APK
        run: test -f android-player/app/build/outputs/apk/debug/app-debug.apk

      - name: Rename APK
        run: cp android-player/app/build/outputs/apk/debug/app-debug.apk SanttosPlayer-v0.1.2-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: SanttosPlayer-v0.1.2-debug
          path: SanttosPlayer-v0.1.2-debug.apk
          if-no-files-found: error
          retention-days: 30
